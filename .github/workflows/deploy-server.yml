# بيرفع كود السيرفر (server/functions) على Firebase لوحده كل ما الكود يتغير.
# المفتاح بيتقري من GitHub Secrets (FIREBASE_SA) ومبيظهرش في أي مكان.
name: Deploy server (Firebase Functions)
on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/deploy-server.yml']
  workflow_dispatch:
concurrency: deploy-server
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check key
        env: { SA: '${{ secrets.FIREBASE_SA }}' }
        run: |
          if [ -z "$SA" ]; then echo "::warning::المفتاح FIREBASE_SA لسه مش متحط في GitHub Secrets — مفيش رفع"; echo "skip=1" >> "$GITHUB_ENV"; fi
      - uses: actions/setup-node@v4
        if: env.skip != '1'
        with: { node-version: '22' }
      - name: Install
        if: env.skip != '1'
        run: cd server/functions && npm install --no-audit --no-fund
      - name: Deploy
        if: env.skip != '1'
        env: { SA: '${{ secrets.FIREBASE_SA }}' }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          # خدمات Google اللي الرفع محتاجها ومش بتتفعّل لوحدها
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet || true
          gcloud services enable cloudbilling.googleapis.com cloudscheduler.googleapis.com run.googleapis.com eventarc.googleapis.com --project almoallem-system --quiet || true
          cd server
          npx --yes firebase-tools@14 deploy --only functions --project almoallem-system --force --non-interactive \
            || { echo "محاولة تانية بعد دقيقتين (الخدمات الجديدة بتاخد وقت تشتغل)"; sleep 120; npx --yes firebase-tools@14 deploy --only functions --project almoallem-system --force --non-interactive; }
          rm -f "$RUNNER_TEMP/sa.json"
      - name: Verify (status + logs)
        if: always() && env.skip != '1'
        env: { SA: '${{ secrets.FIREBASE_SA }}' }
        run: |
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          gcloud auth activate-service-account --key-file="$RUNNER_TEMP/sa.json" --quiet || true
          echo "== functions"; gcloud functions list --project almoallem-system --format="table(name,state,environment)" 2>&1 || true
          echo "== scheduler"; gcloud scheduler jobs list --project almoallem-system --location europe-west1 --format="table(name,schedule,state,lastAttemptTime,status.code)" 2>&1 || true
          echo "== tick logs"; gcloud logging read 'resource.type="cloud_run_revision" AND resource.labels.service_name="tick"' --project almoallem-system --limit 15 --freshness=2h --format="value(timestamp,severity,textPayload,httpRequest.status)" 2>&1 || true
          echo "== status"; cd server/functions && node -e "
            const a=require('firebase-admin');a.initializeApp({projectId:'almoallem-system'});
            const db=a.firestore();Promise.all(['serverStatus','sysAlive'].map(d=>db.collection('meta').doc(d).get())).then(r=>{r.forEach(s=>console.log(s.id,JSON.stringify(s.data()||null)));process.exit(0)}).catch(e=>{console.log('read failed',e.message);process.exit(0)})" || true
          rm -f "$RUNNER_TEMP/sa.json"
