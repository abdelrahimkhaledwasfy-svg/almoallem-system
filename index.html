<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>المعلم - نظام إدارة الفواتير والمبيعات والمخزون</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.9/dist/chart.umd.min.js"></script>
    <style>
        :root {
            --primary: #8B0000; --primary-light: #B22222; --secondary: #DAA520;
            --accent: #27ae60; --danger: #e74c3c; --warning: #f39c12; --info: #3498db;
            --purple: #8e44ad; --teal: #16a085; --profit: #2ecc71; --profit-dark: #1e8449;
            --bg: #f8f5f0; --card-bg: #ffffff; --text: #2c3e50; --text-light: #7f8c8d;
            --border: #e1e8ed; --shadow: 0 4px 20px rgba(0,0,0,0.08);
            --shadow-lg: 0 10px 40px rgba(0,0,0,0.12); --radius: 12px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            --brand-red: #8B0000; --brand-gold: #DAA520; --brand-dark: #1a1a1a;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Tajawal', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; overflow-x: hidden; }
        .sidebar { position: fixed; right: 0; top: 0; width: 280px; height: 100vh;
            background: linear-gradient(180deg, var(--primary) 0%, #4a0000 100%); color: white;
            padding: 0; z-index: 1000; transition: var(--transition); box-shadow: -5px 0 25px rgba(0,0,0,0.1);
            overflow: hidden; display: flex; flex-direction: column; }
        .sidebar.collapsed { width: 80px; }
        .sidebar-header { padding: 25px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; gap: 15px; }
        .sidebar-header .logo { width: 45px; height: 45px; background: var(--secondary); border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
        .sidebar-header h1 { font-size: 18px; font-weight: 700; white-space: nowrap; overflow: hidden; }
        .sidebar.collapsed .sidebar-header h1, .sidebar.collapsed .menu-text { display: none; }
        .nav-menu { padding: 20px 15px; list-style: none; flex: 1; overflow-y: auto; overflow-x: hidden; min-height: 0; }
        .nav-item { margin-bottom: 8px; }
        .nav-link { display: flex; align-items: center; gap: 15px; padding: 14px 18px; color: rgba(255,255,255,0.7); text-decoration: none; border-radius: 10px; transition: var(--transition); cursor: pointer; font-size: 15px; font-weight: 500; }
        .nav-link:hover, .nav-link.active { background: rgba(255,255,255,0.1); color: white; transform: translateX(-5px); }
        .nav-link.active { background: var(--brand-gold); box-shadow: 0 4px 15px rgba(218,165,32,0.3); color: var(--brand-dark) !important; }
        .nav-link i { font-size: 18px; width: 24px; text-align: center; flex-shrink: 0; }
        .toggle-btn { 
            position: absolute; 
            left: -18px; 
            top: 90px; 
            width: 36px; 
            height: 36px; 
            background: linear-gradient(135deg, var(--brand-gold), #B8860B); 
            border: 3px solid var(--brand-red); 
            border-radius: 50%; 
            color: var(--brand-dark); 
            cursor: pointer; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.3), 0 0 0 4px rgba(139,0,0,0.15); 
            z-index: 1001; 
            transition: var(--transition); 
            font-size: 14px;
        }
        .toggle-btn:hover { 
            transform: scale(1.15) rotate(180deg); 
            box-shadow: 0 6px 20px rgba(218,165,32,0.4), 0 0 0 4px rgba(139,0,0,0.2); 
            background: linear-gradient(135deg, #F4D03F, var(--brand-gold)); 
        }
        .toggle-btn:active { transform: scale(0.95); }
        .sidebar.collapsed .toggle-btn { left: -18px; background: linear-gradient(135deg, #F4D03F, var(--brand-gold)); }
        .sidebar.collapsed .toggle-btn:hover { transform: scale(1.15) rotate(-180deg); }
        .main-content { margin-right: 280px; padding: 30px; transition: var(--transition); min-height: 100vh; }
        .main-content.expanded { margin-right: 80px; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; background: var(--card-bg); padding: 20px 30px; border-radius: var(--radius); box-shadow: var(--shadow); }
        .page-title { font-size: 24px; font-weight: 800; color: var(--brand-red); }
        .user-info { display: flex; align-items: center; gap: 15px; }
        .user-avatar { width: 45px; height: 45px; background: linear-gradient(135deg, var(--brand-red), #a00000); border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-weight: 700; font-size: 18px; }
        .date-display { color: var(--text-light); font-size: 14px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: var(--card-bg); padding: 25px; border-radius: var(--radius); box-shadow: var(--shadow); position: relative; overflow: hidden; transition: var(--transition); cursor: pointer; }
        .stat-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); }
        .perf-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; }
        .perf-block { background: var(--bg); border-radius: 10px; padding: 18px; }
        .perf-block-label { font-size: 13px; color: var(--text-light); font-weight: 600; margin-bottom: 8px; }
        .perf-block-value { font-size: 22px; font-weight: 800; color: var(--text); margin-bottom: 6px; }
        .perf-block-change { font-size: 13px; font-weight: 700; display: flex; align-items: center; gap: 5px; margin-bottom: 4px; }
        .perf-block-change.positive { color: var(--accent); } .perf-block-change.negative { color: var(--danger); }
        .perf-block-sub { font-size: 12px; color: var(--text-light); }
        .stat-card::before { content: ''; position: absolute; top: 0; right: 0; width: 5px; height: 100%; }
        .stat-card.sales::before { background: var(--accent); } .stat-card.invoices::before { background: var(--brand-red); }
        .stat-card.products::before { background: var(--brand-gold); } .stat-card.customers::before { background: var(--warning); }
        .stat-card.salesmen::before { background: var(--info); } .stat-card.credit::before { background: var(--danger); }
        .stat-card.inventory::before { background: var(--purple); } .stat-card.purchases::before { background: var(--teal); }
        .stat-card.profit::before { background: var(--profit); }

        .stat-card.treasury::before { background: #2c3e50; }
        .stat-card.suppliers::before { background: #d35400; }
        .stat-icon { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 22px; margin-bottom: 15px; }
        .stat-card.sales .stat-icon { background: rgba(39,174,96,0.1); color: var(--accent); }
        .stat-card.invoices .stat-icon { background: rgba(30,58,95,0.1); color: var(--primary); }
        .stat-card.products .stat-icon { background: rgba(230,126,34,0.1); color: var(--secondary); }
        .stat-card.customers .stat-icon { background: rgba(243,156,18,0.1); color: var(--warning); }
        .stat-card.salesmen .stat-icon { background: rgba(52,152,219,0.1); color: var(--info); }
        .stat-card.credit .stat-icon { background: rgba(231,76,60,0.1); color: var(--danger); }
        .stat-card.inventory .stat-icon { background: rgba(142,68,173,0.1); color: var(--purple); }
        .stat-card.purchases .stat-icon { background: rgba(22,160,133,0.1); color: var(--teal); }
        .stat-card.profit .stat-icon { background: rgba(46,204,113,0.1); color: var(--profit); }
        .stat-card.expenses .stat-icon { background: rgba(230,126,34,0.1); color: #e67e22; }
        .stat-card.treasury .stat-icon { background: rgba(44,62,80,0.1); color: #2c3e50; }
        .stat-card.suppliers .stat-icon { background: rgba(211,84,0,0.1); color: #d35400; }
        .stat-value { font-size: 28px; font-weight: 800; color: var(--text); margin-bottom: 5px; }
        .stat-label { font-size: 14px; color: var(--text-light); font-weight: 500; }
        .stat-change { font-size: 12px; margin-top: 8px; font-weight: 600; }
        .stat-change.positive { color: var(--accent); } .stat-change.negative { color: var(--danger); }
        .section { display: none; animation: fadeIn 0.4s ease; }
        .section.active { display: block !important; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .card { background: var(--card-bg); border-radius: var(--radius); box-shadow: var(--shadow); padding: 25px; margin-bottom: 25px; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; padding-bottom: 15px; border-bottom: 2px solid var(--bg); flex-wrap: wrap; gap: 15px; }
        .card-title { font-size: 20px; font-weight: 700; color: var(--primary); display: flex; align-items: center; gap: 10px; }
        .btn { padding: 12px 24px; border: none; border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer; transition: var(--transition); display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--brand-red); color: white; } .btn-primary:hover { background: #a00000; transform: translateY(-2px); box-shadow: 0 4px 15px rgba(139,0,0,0.3); }
        .btn-success { background: var(--accent); color: white; } .btn-success:hover { background: #219a52; transform: translateY(-2px); }
        .btn-danger { background: var(--danger); color: white; } .btn-warning { background: var(--warning); color: white; }
        .btn-secondary { background: var(--secondary); color: white; } .btn-info { background: var(--info); color: white; }
        .btn-purple { background: var(--purple); color: white; } .btn-teal { background: var(--teal); color: white; }
        .btn-profit { background: var(--profit); color: white; } .btn-profit:hover { background: var(--profit-dark); transform: translateY(-2px); }
        .btn-dark { background: #2c3e50; color: white; } .btn-dark:hover { background: #1a252f; transform: translateY(-2px); }
        .btn-orange { background: #e67e22; color: white; } .btn-orange:hover { background: #d35400; transform: translateY(-2px); }
        .btn-sm { padding: 8px 16px; font-size: 13px; }
        .btn-icon { width: 36px; height: 36px; padding: 0; justify-content: center; border-radius: 8px; }
        .table-container { overflow-x: auto; border-radius: 10px; border: 1px solid var(--border); }
        table { width: 100%; border-collapse: collapse; font-size: 14px; }
        thead { background: var(--brand-red); color: white; }
        th { padding: 15px; text-align: right; font-weight: 600; font-size: 13px; text-transform: uppercase; letter-spacing: 0.5px; }
        td { padding: 14px 15px; border-bottom: 1px solid var(--border); }
        tbody tr { transition: var(--transition); } tbody tr:hover { background: rgba(30,58,95,0.03); }
        tbody tr:nth-child(even) { background: rgba(240,242,245,0.5); }
        .badge { padding: 5px 12px; border-radius: 20px; font-size: 12px; font-weight: 600; }
        .badge-success { background: rgba(39,174,96,0.1); color: var(--accent); }
        .badge-warning { background: rgba(243,156,18,0.1); color: var(--warning); }
        .badge-danger { background: rgba(231,76,60,0.1); color: var(--danger); }
        .badge-info { background: rgba(52,152,219,0.1); color: var(--info); }
        .badge-primary { background: rgba(30,58,95,0.1); color: var(--primary); }
        .badge-purple { background: rgba(142,68,173,0.1); color: var(--purple); }
        .badge-teal { background: rgba(22,160,133,0.1); color: var(--teal); }
        .badge-profit { background: rgba(46,204,113,0.1); color: var(--profit); }
        .badge-orange { background: rgba(230,126,34,0.1); color: #e67e22; }
        .badge-dark { background: rgba(44,62,80,0.1); color: #2c3e50; }
        .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .form-group { margin-bottom: 5px; }
        .form-label { display: block; margin-bottom: 8px; font-weight: 600; font-size: 14px; color: var(--text); }
        .form-control { width: 100%; padding: 12px 15px; border: 2px solid var(--border); border-radius: 8px; font-family: 'Tajawal', sans-serif; font-size: 14px; transition: var(--transition); background: white; }
        .form-control:focus { outline: none; border-color: var(--brand-red); box-shadow: 0 0 0 3px rgba(139,0,0,0.1); }
        select.form-control { cursor: pointer; }
        .invoice-container { background: white; border-radius: var(--radius); box-shadow: var(--shadow-lg); padding: 40px; max-width: 900px; margin: 0 auto; }
        .invoice-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 30px; padding-bottom: 20px; border-bottom: 3px solid var(--brand-red); }
        .invoice-logo { display: flex; align-items: center; gap: 15px; }
        .invoice-logo-icon { width: 60px; height: 60px; background: var(--primary); border-radius: 12px; display: flex; align-items: center; justify-content: center; color: white; font-size: 28px; }
        .invoice-logo-text h2 { font-size: 24px; color: var(--primary); margin-bottom: 5px; }
        .invoice-logo-text p { color: var(--text-light); font-size: 14px; }
        .invoice-info { text-align: left; }
        .invoice-info-row { display: flex; gap: 10px; margin-bottom: 8px; font-size: 14px; }
        .invoice-info-label { font-weight: 600; color: var(--text-light); min-width: 80px; }
        .invoice-info-value { font-weight: 700; color: var(--brand-red); }
        .invoice-details { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-bottom: 30px; padding: 20px; background: var(--bg); border-radius: 10px; }
        .invoice-detail-group { display: flex; flex-direction: column; gap: 8px; }
        .invoice-detail-group label { font-weight: 600; font-size: 13px; color: var(--text-light); }
        .invoice-items-table { width: 100%; margin-bottom: 30px; border: 2px solid var(--primary); border-radius: 10px; overflow: hidden; }
        .invoice-items-table th { background: var(--brand-red); color: white; padding: 12px; text-align: center; }
        .invoice-items-table td { padding: 12px; text-align: center; border-bottom: 1px solid var(--border); }
        .invoice-items-table input, .invoice-items-table select { width: 100%; padding: 8px; border: 1px solid var(--border); border-radius: 6px; font-family: 'Tajawal', sans-serif; text-align: center; }
        .invoice-total { display: flex; justify-content: flex-end; align-items: center; gap: 20px; padding: 20px; background: var(--bg); border-radius: 10px; margin-bottom: 20px; }
        .invoice-total-label { font-size: 18px; font-weight: 700; color: var(--text-light); }
        .invoice-total-value { font-size: 28px; font-weight: 800; color: var(--brand-red); }
        .invoice-actions { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .inventory-alert { background: linear-gradient(135deg, rgba(231,76,60,0.08), rgba(231,76,60,0.02)); border: 1px solid rgba(231,76,60,0.2); border-radius: 10px; padding: 15px 20px; margin-bottom: 20px; display: flex; align-items: center; gap: 12px; color: var(--danger); font-weight: 600; font-size: 14px; }
        .inventory-alert i { font-size: 20px; }

        .profit-card { background: linear-gradient(135deg, rgba(139,0,0,0.08), rgba(139,0,0,0.02)); border: 1px solid rgba(139,0,0,0.2); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
        .profit-value { font-size: 32px; font-weight: 800; color: var(--brand-red); }
        .profit-label { font-size: 14px; color: var(--text-light); font-weight: 500; }
        .profit-margin { font-size: 18px; font-weight: 700; color: var(--brand-gold); }
        @media print { .sidebar, .top-bar, .invoice-actions, .toggle-btn, .nav-menu, .btn-delete-row, .inventory-alert, .no-print { display: none !important; }
            .main-content { margin: 0 !important; padding: 0 !important; }
            .invoice-container { box-shadow: none; max-width: 100%; }
            .section { display: none !important; }
            #invoice-section.section.active, #purchase-invoice-section.section.active, #customers-section.section.active { display: block !important; }
            #customers-section.section.active .card:not(#customerStatementCard) { display: none !important; }
            body { background: white; } .card { box-shadow: none; border: 1px solid #ddd; }
            body.printing-invoice-mode > *:not(#printInvoiceArea) { display: none !important; }

        }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(5px); }
        .modal-overlay.active { display: flex; }

        .modal-title { font-size: 18px; font-weight: 700; color: var(--brand-red); }

        .modal-close:hover { color: var(--danger); transform: rotate(90deg); }
        .modal-body { padding: 25px; } .modal-footer { padding: 20px 25px; border-top: 2px solid var(--bg); display: flex; justify-content: flex-end; gap: 10px; }
        .search-box { position: relative; margin-bottom: 20px; }
        .search-box input { width: 100%; padding: 12px 45px 12px 15px; border: 2px solid var(--border); border-radius: 10px; font-family: 'Tajawal', sans-serif; font-size: 14px; transition: var(--transition); }
        .search-box input:focus { border-color: var(--brand-red); outline: none; }
        .search-box i { position: absolute; right: 15px; top: 50%; transform: translateY(-50%); color: var(--text-light); }
